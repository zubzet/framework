name: Unit tests

# Called by the tests workflow, which only starts the E2E suite once these pass
on:
  workflow_call:
    # How many tests one job runs and how many jobs ran them, for the
    # transparency job of the tests workflow
    outputs:
      php_tests:
        value: ${{ jobs.php.outputs.tests }}
      php_jobs:
        value: ${{ jobs.php.outputs.jobs }}
      js_tests:
        value: ${{ jobs.js.outputs.tests }}
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every version runs the same tests, so one job's count stands for all
    outputs:
      tests: ${{ steps.count.outputs.tests }}
      jobs: ${{ strategy.job-total }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The suite takes well under a second, so every supported version
        # runs on every push instead of only the extremes.
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The committed lock file is resolved on one PHP version. A library
      # is installed without it, so the dependencies are resolved for the
      # version under test.
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run PHP unit tests
        run: composer test

      - name: Count the tests
        id: count
        run: echo "tests=$(vendor/bin/phpunit --list-tests | grep -c '^ - ')" >> "$GITHUB_OUTPUT"

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.count.outputs.tests }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/unit/js

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/unit/js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Z.js unit tests
        run: npm test

      - name: Count the tests
        id: count
        run: echo "tests=$(npx mocha --dry-run --reporter json | jq '.stats.tests')" >> "$GITHUB_OUTPUT"
