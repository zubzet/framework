name: Coverage report

on:
  # Called by the tests workflow on develop, which publishes the number
  workflow_call:
    outputs:
      summary:
        description: The line coverage as JSON
        value: ${{ jobs.coverage.outputs.summary }}
  workflow_dispatch:
  # A pull request from a fork cannot be started manually. Adding the
  # `coverage` label to it runs the workflow; remove + re-add to re-run.
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: github.event_name != 'pull_request' || github.event.label.name == 'coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # a run takes about 17 minutes
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.summary.outputs.summary }}

    env:
      COMPOSE_DOCKER_CLI_BUILD: "1"
      DOCKER_BUILDKIT: "1"

    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Detect host UID
        run: echo "HOST_UID=$(id -u)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build with the xdebug-enabled PHP 8.5 base so the coverage driver
      # is available inside the application container.
      - name: Docker build (8.5-xdebug)
        uses: docker/build-push-action@v7
        with:
          context: ./tests/e2e/packaging/docker
          file: ./tests/e2e/packaging/docker/Dockerfile.apache-local
          tags: docker-application:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=app-8.5-xdebug
          cache-to: type=gha,mode=max,scope=app-8.5-xdebug
          build-args: |
            PHP_TAG=8.5-xdebug
            USER_UID=${{ env.HOST_UID }}

      # Compose override that switches XDEBUG_MODE to coverage. This keeps
      # the base file untouched (which may have debug,coverage for local dev).
      - name: Write coverage compose override
        run: |
          cat > packaging/docker/docker-compose.override.yml <<'EOF'
          services:
            application:
              environment:
                XDEBUG_MODE: "coverage"
                DEBUG_ZUBZET_COVERAGE_FRAMEWORK: "true"
          EOF

      - name: Pre-pull compose services
        run: |
          docker compose \
            -f packaging/docker/docker-compose-base.yml \
            -f packaging/docker/docker-compose.override.yml \
            pull || true

      - name: Start application stack
        run: |
          docker compose \
            -f packaging/docker/docker-compose-base.yml \
            -f packaging/docker/docker-compose.override.yml \
            up -d --remove-orphans --wait
          docker compose \
            -f packaging/docker/docker-compose-base.yml \
            -f packaging/docker/docker-compose.override.yml \
            ps

      - name: Install PHP dependencies (inside container)
        run: docker exec application composer install --no-interaction --prefer-dist --no-progress

      - name: Seed database
        run: docker exec application php index.php db:seed

      - name: Start coverage session
        run: docker exec application php index.php testing:coverage:start

      - name: Run E2E tests (Cypress)
        env:
          CI: true
        # Test failures shouldn't abort the run - the coverage report is the
        # primary output. The step's status still surfaces in the run UI.
        continue-on-error: true
        run: bun run tests

      # The PHP unit tests run in the same container, so their coverage
      # names the source files by the same paths and can be merged in.
      # Installed after the E2E run to leave that one as it is. The container
      # points Composer to the vendor folder of the application, so the
      # framework is told to use its own.
      - name: Install the development dependencies of the framework
        run: docker exec -e COMPOSER_VENDOR_DIR=vendor -w /var/www/framework application composer update --no-interaction --prefer-dist --no-progress

      - name: Run PHP unit tests with coverage
        run: docker exec -w /var/www/framework application vendor/bin/phpunit --coverage-php /tmp/unit.cov

      - name: Stop coverage and generate report
        if: always()
        # With pipefail a failed report is not hidden behind `tee`
        shell: bash
        run: docker exec application php -d memory_limit=4G index.php testing:coverage:stop --merge /tmp/unit.cov | tee coverage-summary

      - name: Summarize the coverage
        id: summary
        # With pipefail a summary without the line fails instead of
        # handing on an empty number
        shell: bash
        run: |
          summary=$(sed -E 's/\x1b\[[0-9;]*m//g' coverage-summary | grep 'Lines:' | jq -R -c '
            capture("(?<percent>[0-9.]+)% \\((?<covered>[0-9]+)/(?<total>[0-9]+)\\)")
            | {
              lines_percent: (.percent | tonumber),
              lines_covered: (.covered | tonumber),
              lines_total: (.total | tonumber),
              php_version: "8.5"
            }
          ')
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_attempt }}
          if-no-files-found: warn
          path: tests/e2e/.coverage/report/**

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            tests/e2e/tests/cypress/screenshots/**
            tests/e2e/cypress/screenshots/**
