<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html/webroot

    <Directory /var/www/html/webroot>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The same app below /sub with a non-empty rootDirectory, for the
    # link building checks in core/root-directory.cy.js. Rewritten here
    # rather than by the webroot .htaccess: that one redirects internally,
    # which would rename the variable to REDIRECT_CONFIG_ROOTDIRECTORY.
    Alias /sub /var/www/html/webroot
    RewriteEngine On
    RewriteCond /var/www/html/webroot$1 !-f
    RewriteRule ^/sub(/.*)?$ /var/www/html/webroot/index.php [L,QSA,E=CONFIG_ROOTDIRECTORY:sub]

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
