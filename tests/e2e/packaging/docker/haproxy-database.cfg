# Plays the role of the production service mesh: the application sees ONE
# database endpoint; this proxy round-robins connections across the healthy
# Galera nodes (multi-writer, like production). On node death the dead node
# leaves the rotation and its sessions are shut down, so clients observe a
# dropped connection and reconnect, exactly like production.

global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode tcp
    # Fail fast: a client waiting on a dead backend must get its session
    # closed quickly, because a MySQL client waiting for the server greeting
    # has no read timeout of its own. A blackholed backend may hold a session
    # for at most retries x connect timeout before the proxy closes it.
    timeout connect 2s
    retries 1
    # The app's own idle/heartbeat handling owns long-lived connections; these
    # just have to outlive any e2e request comfortably.
    timeout client 300s
    timeout server 300s

listen galera
    bind *:3306
    balance roundrobin
    timeout check 1s
    default-server inter 500ms fall 2 rise 2 on-marked-down shutdown-sessions
    server galera1 galera1:3306 check
    server galera2 galera2:3306 check
    server galera3 galera3:3306 check
